title: Zhang Zhoutao
description: "Zhang Zhoutao 的个人学术主页，研究、项目与文字记录。"
url: "https://dune-arrakis.cn"
baseurl: ""
lang: zh-CN
author: Zhang Zhoutao
timezone: Asia/Shanghai
future: true

# 保留原有文章的日期路径，已有链接无需修改。
permalink: pretty
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      image: /avatar.jpg

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  # 保留公式分隔符，交由文章页的 KaTeX 渲染。
  math_engine: null
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

webmaster_verifications:
  google: YIKi1rBnyUaS-DMYiluseI5kZzTwjCkTFmKkSkMZDJk
  baidu: szbTSfUGAB

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .cache
  - 双击自动提交.bat
