title: Zhang Zhoutao
description: "张洲滔的个人学术主页，研究与文字记录。"
url: "https://dune-arrakis.cn"
baseurl: ""
lang: zh-CN
author: Zhang Zhoutao
timezone: Asia/Shanghai
future: true
show_projects: false

# 保留原有文章的日期路径，已有链接无需修改。
permalink: pretty
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      image: /avatar.jpg

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-relative-links

# 按 Markdown 源文件的位置解析图片和附件的相对路径，包含 _posts。
relative_links:
  enabled: true
  collections: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  # 保留公式分隔符，交由文章页的 KaTeX 渲染。
  math_engine: null
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

webmaster_verifications:
  google: YIKi1rBnyUaS-DMYiluseI5kZzTwjCkTFmKkSkMZDJk
  baidu: szbTSfUGAB

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .cache
  - 双击自动提交.bat
  - 双击自动拉取.bat
