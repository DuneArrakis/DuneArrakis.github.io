<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/avatar.jpg' | relative_url }}" type="image/jpeg">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <script defer src="{{ '/assets/js/academic.js' | relative_url }}"></script>
</head>
<body class="{% if page.home %}is-home{% else %}is-inner{% endif %}">
  {% assign profile = site.data.academic.profile %}
  <a class="skip-link" href="#main-content">跳转到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ profile.name | escape }}<span class="brand-dot">.</span></a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.home %}aria-current="page"{% endif %}>关于</a>
        <a href="{{ '/#research' | relative_url }}">研究</a>
        <a href="{{ '/#publications' | relative_url }}">成果</a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.section == 'writing' or page.layout == 'post' %}aria-current="page"{% endif %}>文章归档 <span class="nav-arrow" aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <div class="site-shell">
    {% include profile.html %}
    <main id="main-content" tabindex="-1">{{ content }}</main>
  </div>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>© {{ site.time | date: '%Y' }} {{ profile.name | escape }}</span>
      <span class="footer-note">研究 · 探索 · 记录</span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS {% include icon.html name='arrow' %}</a>
    </div>
  </footer>
</body>
</html>
